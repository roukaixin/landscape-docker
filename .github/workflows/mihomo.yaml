name: build mihomo docker image

on:
  push:
    paths:
      - "docker/mihomo/**"

permissions:
  contents: read
  packages: write

env:
  NAME: mihomo
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}/mihomo

jobs:
  builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        settings:
          - docker_platform: linux/arm64
            pkg_arch: aarch64
            static: true
            docker_builder_imager: golang:1.26.8
            docker_run_imager: alpine
          - docker_platform: linux/loong64
            pkg_arch: loongarch64
            static: true
            docker_builder_imager: ghcr.io/loong64/golang:1.26
            docker_run_imager: ghcr.io/loong64/alpine
          - docker_platform: linux/riscv64
            pkg_arch: riscv64
            static: true
            docker_builder_imager: golang:1.26.8
            docker_run_imager: alpine
          - docker_platform: linux/s390x
            pkg_arch: s390x
            static: false
            docker_builder_imager: golang:1.26.8
            docker_run_imager: alpine
          - docker_platform: linux/amd64
            pkg_arch: x86_64
            static: true
            docker_builder_imager: golang:1.26.8
            docker_run_imager: alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions
        run: |
          cat docker/${{ env.mihomo }}/version >> "$GITHUB_ENV"

      - name: Set redirect architecture
        run: |
          if [[ "${{ matrix.settings.static }}" == "true" ]]; then
            echo "REDIRECT_ARCH=${{ matrix.settings.pkg_arch }}-static" >> "$GITHUB_ENV"
          else
            echo "REDIRECT_ARCH=${{ matrix.settings.pkg_arch }}" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./docker/${{ env.mihomo }}
          build-args: |
            MIHOMO_VERSION=${{ env.MIHOMO_VERSION }}
            REDIRECT_PKG_HANDLER_VERSION=${{ env.REDIRECT_PKG_HANDLER_VERSION }}
            REDIRECT_ARCH=${{ env.REDIRECT_ARCH }}
            BUILDER_IMAGER=${{ matrix.settings.docker_builder_imager }}
            RUN_IMAGER=${{ matrix.settings.docker_run_imager }}
          platforms: ${{ matrix.settings.docker_platform }}
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/${{ env.mihomo }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/${{ env.mihomo }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.settings.pkg_arch }}
          path: /tmp/${{ env.mihomo }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - builds
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions
        run: |
          cat docker/${{ env.mihomo }}/version >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/${{ env.mihomo }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.MIHOMO_VERSION }}-${{ env.REDIRECT_PKG_HANDLER_VERSION }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/${{ env.mihomo }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          echo '${{ steps.meta.outputs.tags }}' | while IFS= read -r tag; do
            echo "Inspecting ${tag}"
            docker buildx imagetools inspect "${tag}"
          done

  cleanup:
    needs:
      - merge
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          owner: roukaixin
          package: landscape-docker/mihomo
          delete-untagged: true
          log-level: debug